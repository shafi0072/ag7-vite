version: '3.8'

services:
  api:
    build: .
    container_name: ag7-api
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx/conf.d:/etc/nginx/conf.d
      - memory_data:/data/memory
    env_file: .env
    networks:
      - openclaw-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ag7-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - openclaw-network
    restart: unless-stopped

  openclaw:
    build: ../../docker/openclaw
    # Path relative to this docker-compose.yml → ag7-vite/docker/openclaw
    container_name: ag7-openclaw
    ports:
      - "18789:18789"
    volumes:
      - memory_data:/data/memory
    environment:
      - KIMI_API_KEY=${KIMI_API_KEY}
    networks:
      - openclaw-network
    restart: unless-stopped

networks:
  openclaw-network:
    driver: bridge

volumes:
  memory_data:
